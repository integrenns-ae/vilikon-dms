name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      # The Werkzeug is built with pip from requirements.txt: it must say what the lock says.
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt && git diff --exit-code requirements.txt
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  werkzeug:
    # Built and started the way the Werkzeug-Verwalter does it (ADAPTER.json): Python 3.11, pip, no uv.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: |
          DATA_DIR="$RUNNER_TEMP/dms" PORT=8091 .venv/bin/python -m app &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8091/health && exit 0; sleep 1; done
          exit 1
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vilikon-dms:ci .
