name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      # The Werkzeug is built with pip from requirements.txt: it must say what the lock says.
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt && git diff --exit-code requirements.txt
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  werkzeug:
    # Built and started the way the Werkzeug-Verwalter does it: the build and start of ADAPTER.json, Python 3.11 with
    # pip and Node 22 with npm, no uv. Then the page and its script must come back behind the token.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh -c "$(python3 -c 'import json; print(json.load(open("ADAPTER.json"))["build"])')"
      - run: |
          DATA_DIR="$RUNNER_TEMP/dms" PORT=8091 VILIKON_TOKEN=ci-token .venv/bin/python -m app &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8091/health && break; sleep 1; done
          login=(-H "X-Vilikon-Token: ci-token" -H "X-Vilikon-Benutzer: ci@example.com")
          curl -fs "${login[@]}" http://127.0.0.1:8091/ > page.html
          grep -q '<html lang="de">' page.html
          script=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' page.html)
          curl -fs "${login[@]}" "http://127.0.0.1:8091/$script" > /dev/null
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vilikon-dms:ci .
