[project]
name = "vilikon-dms"
dynamic = ["version"]
description = "Vilikon document intake: paper post from file stores and phone photos into the company memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "paramiko>=3.4",
    "pillow>=10.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]  # B008: FastAPI Depends idiom; RUF00x: German typography

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["app"]
